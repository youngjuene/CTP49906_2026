; pytest.ini rather than a [tool.pytest.ini_options] block, for the same reason
; as avllm_interpretability/pytest.ini: no pyproject.toml, not an installable
; package, and adding one would imply a build backend nobody wants. This file
; also fixes rootdir at feedback-atlas/, which is what tests/conftest.py puts on
; sys.path.

[pytest]
testpaths = tests

; --strict-markers so a typo'd marker is an error, not a silently-never-selected
; test.
addopts = --strict-markers

; One line per marker -- pytest splits this value on newlines, so a wrapped
; description would register as a second, bogus marker.
markers =
    needs_umap: needs the optional umap-learn dependency; auto-skipped by tests/conftest.py when it is absent.
    needs_fastapi: needs the optional fastapi dependency; auto-skipped by tests/conftest.py when it is absent.
    needs_httpx: needs the optional httpx dependency; auto-skipped by tests/conftest.py when it is absent.
