<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>피드백 지도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='19' r='6' fill='%231f77b4'/%3E%3Cpath d='M21 6l7 7-7 7-7-7z' fill='%23ff7f0e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ 랜딩: ID 확인 (PRD 5.1) ============ -->
<section class="gate view" id="view-gate">
  <form class="gate-card" id="gate-form" autocomplete="off" novalidate>
    <h1>피드백 지도</h1>
    <p class="sub" id="gate-sub">발표 세션</p>
    <div class="field">
      <label for="gate-id">내 ID</label>
      <input type="text" id="gate-id" name="id" autocapitalize="off"
             autocorrect="off" spellcheck="false" enterkeyhint="go" required>
    </div>
    <div class="err" id="gate-error" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/>
        <path d="M12 8v5M12 16h.01"/></svg>
      <span id="gate-error-text"></span>
    </div>
    <button class="btn pri tall" type="submit" id="gate-submit">들어가기</button>
    <p class="hint">비밀번호는 없습니다. 명단 확인만 합니다.</p>
  </form>
</section>

<!-- ============ 관리자 접근 코드 (PRD 5.6) ============ -->
<section class="gate view" id="view-admin-gate" hidden>
  <form class="gate-card" id="admin-form" autocomplete="off" novalidate>
    <h1>관리자 모드</h1>
    <p class="sub">작성자 정보가 표시됩니다.</p>
    <div class="field">
      <label for="admin-code">접근 코드</label>
      <input type="password" id="admin-code" name="code" enterkeyhint="go" required>
    </div>
    <div class="err" id="admin-error" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/>
        <path d="M12 8v5M12 16h.01"/></svg>
      <span id="admin-error-text"></span>
    </div>
    <button class="btn pri tall" type="submit">들어가기</button>
    <p class="hint"><a href="#" id="admin-back">참가자 화면으로 돌아가기</a></p>
  </form>
</section>

<!-- ============ 메인 ============ -->
<main class="shell view" id="view-main" hidden>
  <header class="bar">
    <div class="logo">피드백 지도</div>
    <span class="admin-badge" id="admin-badge" hidden>관리자</span>

    <!-- 주차 필터. 좌표는 그대로 두고 표시만 바꿉니다 (PRD 5.5). -->
    <fieldset class="weeks" id="weeks">
      <legend class="flabel" style="position:absolute;left:-9999px">주차 필터</legend>
      <label><input type="checkbox" value="1" checked>1주차</label>
      <label><input type="checkbox" value="2" checked>2주차</label>
      <label><input type="checkbox" value="3" checked>3주차</label>
      <label><input type="checkbox" value="4" checked>4주차</label>
    </fieldset>

    <div class="conn" id="conn"><i></i><span id="conn-text">연결 중…</span></div>
  </header>

  <div class="body">
    <nav class="rail" aria-label="도구">
      <button type="button" id="tab-compose" aria-pressed="true" title="의견 쓰기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span class="sr-only" hidden>의견 쓰기</span>
      </button>
      <button type="button" id="tab-legend" aria-pressed="true" title="범례">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.5"/>
          <path d="M11 7h8M11 17h8"/><path d="m3.5 15 2.5 4 2.5-4z"/></svg>
      </button>
      <button type="button" id="btn-fit" title="화면에 맞추기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
      </button>
      <div class="spacer"></div>
      <button type="button" id="btn-theme" title="밝기 전환">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>

    <div class="map-card" id="map-card">
      <svg id="map" role="img" aria-label="의견 의미 지도"></svg>
      <div class="empty" id="empty" hidden>
        <div><b style="color:var(--fg)">아직 의견이 없습니다.</b><br>
        첫 의견을 남기면 여기에 점으로 나타납니다.</div>
      </div>
      <aside class="legend" id="legend" aria-label="범례"></aside>
      <div class="statusbar">
        <span id="status-msg"></span>
        <span class="spacer"></span>
        <span class="scale" id="scale"></span>
        <span class="div"></span>
        <span id="status-count">0개 표시 / 전체 0개</span>
      </div>
    </div>

    <!-- 의견 입력 (PRD 5.2, 5.3) -->
    <section class="side" id="compose">
      <h2>의견 쓰기</h2>
      <form id="compose-form">
        <div class="field">
          <label for="c-target">대상 학생</label>
          <select id="c-target" required></select>
        </div>
        <div class="field" style="margin-top:10px">
          <label for="c-text">의견</label>
          <textarea id="c-text" maxlength="1000" enterkeyhint="send"
                    placeholder="느낀 그대로 적어 주세요."></textarea>
        </div>
        <div class="row2" style="margin-top:10px">
          <div class="field" style="flex:1">
            <label id="c-source-label">구분</label>
            <div class="seg" id="c-source" role="group" aria-labelledby="c-source-label">
              <button type="button" data-value="ai" aria-pressed="true">
                <svg viewBox="-6 -6 12 12" aria-hidden="true">
                  <path d="M0-5.2 5.2 0 0 5.2-5.2 0Z" fill="currentColor"/></svg>AI</button>
              <button type="button" data-value="human" aria-pressed="false">
                <svg viewBox="-6 -6 12 12" aria-hidden="true">
                  <circle r="4.6" fill="currentColor"/></svg>사람</button>
            </div>
          </div>
          <div class="field" style="width:104px">
            <label for="c-week">주차</label>
            <select id="c-week"></select>
          </div>
        </div>
        <button class="btn pri tall" type="submit" id="c-submit"
                style="width:100%;margin-top:10px">보내기</button>
        <p class="hint" id="c-hint">의견만 채우면 됩니다. 나머지는 기본값으로 들어갑니다.</p>
      </form>
    </section>

    <!-- 관리자 전용 도구. 참가자 채널에는 이 셋 중 어느 것도 없습니다 (PRD 5.6). -->
    <section class="side" id="adminpanel" hidden>
      <div class="apane">
        <h2>검색</h2>
        <input type="text" id="corpus-search" placeholder="의견 본문 검색"
               autocomplete="off" spellcheck="false">
        <p class="hint" id="search-count"></p>
      </div>

      <div class="apane">
        <h2>선택</h2>
        <div class="seg" id="select-mode" role="group" aria-label="선택 도구">
          <button type="button" data-mode="pan" aria-pressed="true">이동</button>
          <button type="button" data-mode="marquee" aria-pressed="false">사각</button>
          <button type="button" data-mode="lasso" aria-pressed="false">올가미</button>
        </div>
        <p class="hint" id="sel-count">지도를 끌어 여러 의견을 한 번에 고릅니다.</p>
        <div class="revlist" id="sel-list"></div>
        <div class="crow">
          <button class="btn" type="button" id="btn-clear-sel">선택 해제</button>
          <button class="btn" type="button" id="btn-export">CSV 내보내기</button>
        </div>
        <p class="hint" id="export-note"></p>
      </div>

      <div class="apane" id="pane-neighbors" hidden>
        <h2>가까운 의견</h2>
        <p class="hint" id="nb-of"></p>
        <div class="revlist" id="nb-list"></div>
      </div>

      <div class="apane">
        <h2>작성자</h2>
        <input type="text" id="rev-search" placeholder="이름 또는 ID 검색"
               autocomplete="off" spellcheck="false">
        <div class="revlist" id="rev-list"></div>
        <p class="hint">선택하면 그 사람의 의견만 강조됩니다.</p>
      </div>
    </section>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
